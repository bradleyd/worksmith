# On a `v*` tag: build release binaries (macOS arm64 + Linux x86_64, static
# musl so the tar.gz runs on any distro) and attach them to the GitHub
# release. The homebrew-worksmith tap's formula points at these artifacts.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          tar -czf "worksmith-${version}-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" worksmith
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: worksmith-*.tar.gz
          generate_release_notes: true
