# Build the Zola docs site and deploy it to GitHub Pages (worksmith.sh).
# Static build only — no Rust toolchain needed. The Zola binary is pinned to
# the same release as the developer's local install so CI and local match.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; never cancel an in-flight one (a cancelled
# deploy can leave Pages in a half-published state).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zola
        env:
          ZOLA_VERSION: 0.23.4
        run: |
          curl -fsSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C /usr/local/bin
          zola --version

      - name: Build
        run: cd docs && zola build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: "${{ steps.d.outputs.page_url }}"
    steps:
      - id: d
        uses: actions/deploy-pages@v4
