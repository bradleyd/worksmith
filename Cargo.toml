[package]
name = "worksmith"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/bradleyd/worksmith"
description = "A minimal terminal coding-agent harness that keeps weaker models on task"

[[bin]]
name = "worksmith"
path = "src/main.rs"

[dependencies]
# async runtime + http
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# errors
anyhow = "1"
thiserror = "2"

# storage / ids / dirs
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"

# cli / repl / tui
clap = { version = "4", features = ["derive"] }
rustyline = "14"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
async-trait = "0.1"
regex = "1"

[dev-dependencies]
tempfile = "3"
