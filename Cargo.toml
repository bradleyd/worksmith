[package]
name = "worksmith"
version = "0.2.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/bradleyd/worksmith"
description = "A minimal terminal coding-agent harness that keeps weaker models on task"

[[bin]]
name = "worksmith"
path = "src/main.rs"

[dependencies]
# async runtime + http
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.13", features = ["json", "stream", "query"] }
futures-util = "0.3"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
# Fingerprinting project configs for the trust store; already in the tree.
sha2 = "0.10"
# OSC 52 clipboard writes; already in the tree.
base64 = "0.22"

# errors
anyhow = "1"
thiserror = "2"

# storage / ids / dirs
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"

# cli / repl / tui
clap = { version = "4", features = ["derive"] }
rustyline = "18"
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
async-trait = "0.1"
regex = "1"
similar = "2"

[dev-dependencies]
tempfile = "3"
