[package]
name = "worksmith"
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/bradleyd/worksmith"
description = "A minimal terminal coding-agent harness that keeps weaker models on task"

[[bin]]
name = "worksmith"
path = "src/main.rs"

[dependencies]
# async runtime + http
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
# Already in the tree via tokio; named directly to kill a process *group*, so a
# timed-out command cannot leave its children holding the machine.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

reqwest = { version = "0.13", features = ["json", "stream", "query"] }
futures-util = "0.3"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
# Fingerprinting project configs for the trust store; already in the tree.
sha2 = "0.11"
# OSC 52 clipboard writes; already in the tree.
base64 = "0.23"

# errors
anyhow = "1"
thiserror = "2"

# storage / ids / dirs
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"

# cli / repl / tui
clap = { version = "4", features = ["derive"] }
rustyline = "18"
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
async-trait = "0.1"
regex = "1"
similar = "3"

[dev-dependencies]
tempfile = "3"

# Drop debuginfo for dependencies only; worksmith itself keeps full symbols.
# This buys disk, not speed: measured at 7.2s either way on a warm rebuild,
# because ~6.4s of that is rustc's frontend on our own 19.7k-line crate and no
# profile knob touches it. What it does buy is target/debug 31G -> 21G on a
# target-dir shared by every project on the machine, which is what made a
# rebuild look like a hang once the incremental cache went I/O-bound.
[profile.dev.package."*"]
debug = 0
