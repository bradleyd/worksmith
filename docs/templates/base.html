<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Worksmith{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; padding: 2rem 1.25rem 4rem;
      font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: #1c1e21; background: #fdfdfd;
    }
    @media (prefers-color-scheme: dark) {
      body { color: #cdd6f4; background: #1e1e2e; }
      a { color: #89b4fa; }
      pre { background: #181825; }
      code { background: #313244; }
    }
    .wrap { max-width: 46rem; margin: 0 auto; }
    nav {
      max-width: 46rem; margin: 0 auto 2rem;
      display: flex; gap: 1.25rem; font-size: 0.95rem;
    }
    nav a { text-decoration: none; opacity: 0.75; }
    nav a:hover { opacity: 1; }
    h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 0.5rem; }
    .lede { font-size: 1.1rem; opacity: 0.8; margin: 0 0 2rem; }
    h2 { margin-top: 2.5rem; border-bottom: 1px solid rgba(128,128,128,0.25); padding-bottom: 0.25rem; }
    p, li { max-width: 46rem; }
    a { color: #0969da; }
    code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 0.9em; background: #f0f1f3; padding: 0.1em 0.35em; border-radius: 4px; }
    pre { background: #f6f7f9; padding: 1rem; border-radius: 8px; overflow-x: auto; }
    pre code { background: none; padding: 0; }
    .mermaid { text-align: center; }
    table { border-collapse: collapse; }
    td, th { border: 1px solid rgba(128,128,128,0.3); padding: 0.35rem 0.7rem; }
    ul.pages { list-style: none; padding: 0; }
    ul.pages li { margin: 0.4rem 0; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Home</a>
    <a href="/quickstart/">Quickstart</a>
    <a href="/guide/">Guide</a>
  </nav>
  <div class="wrap">
    {% block body %}{% endblock %}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script>
    // Zola emits fenced blocks as <pre><code class="language-mermaid">;
    // tag the <pre> so mermaid.run() picks them up.
    document.querySelectorAll("code.language-mermaid").forEach(function (c) {
      c.parentElement.classList.add("mermaid");
    });
    mermaid.run();
  </script>
</body>
</html>
