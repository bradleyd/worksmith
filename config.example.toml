# Worksmith configuration — copy to ~/.worksmith/config.toml (global) and/or
# <project>/.worksmith/config.toml (project overrides global, field by field).

# Default model as "provider/model" (or a bare model name if exactly one
# provider is configured). Override per-run with --model.
model = "vllm/Qwen/Qwen3-32B"
temperature = 0.7
# Keep this generous: tool calls that write whole files put the file content in
# the call's arguments, so a low cap truncates the call mid-JSON.
max-tokens = 4096

# --- Providers -------------------------------------------------------------
# vLLM on RunPod (L40S). Start vLLM with tool-calling enabled, e.g.:
#   vllm serve Qwen/Qwen3-32B \
#     --enable-auto-tool-choice --tool-call-parser hermes
[providers.vllm]
type = "openai-compat"
base-url = "https://<your-pod-id>-8000.proxy.runpod.net/v1"
api-key-env = "VLLM_API_KEY"     # optional; omit if the endpoint needs no key

# A local vLLM / llama.cpp / LM Studio server (no key needed):
[providers.local]
type = "openai-compat"
base-url = "http://localhost:8000/v1"

# OpenRouter (many hosted models behind one key):
[providers.openrouter]
type = "openai-compat"
base-url = "https://openrouter.ai/api/v1"
api-key-env = "OPENROUTER_API_KEY"

# --- Agent -----------------------------------------------------------------
[agent]
max-steps = 50              # max model<->tool iterations per turn
max-retries = 3             # validation re-plan attempts before giving up
stuck-threshold = 3         # identical repeated tool calls before a nudge
# validate = "cargo test"   # default success check (--until overrides per-run)
context-limit = 128000      # approx model context (tokens); compact at 75%
keep-recent-turns = 6       # turns kept verbatim when compacting

[agents]
max = 4                     # max concurrently-running spawned workers (/spawn)
# The supervisor watches each worker's event stream and nudges or stops it.
#   off   — no watching
#   rules — deterministic detection (default)
#   model — cheap-model observer (not built yet; behaves as "rules")
supervisor = "rules"
stuck-timeout = 120         # seconds with no worker event before a nudge
max-nudges = 3              # nudges before the supervisor stops the worker
repeat-threshold = 4        # identical tool calls (whole run) before a nudge
# token-budget = 200000     # completion tokens a worker may spend before it's stopped
# May a bare `/spawn <task>` be split across several workers? "auto" asks a
# cheap planner call (it answers "one worker" for most tasks); "off" always
# spawns one and leaves fan-out to an explicit `-n N` / `--each-files`.
fanout = "auto"
# After a fan-out group all finishes, run one more turn that combines their
# results into a single answer. Set false to just have the results reported.
synthesize = true

[tools]
bash-timeout-secs = 120

# --- Web search -------------------------------------------------------------
# Needed only for `web` search; `web` fetch (read a URL) works without it.
#   brave   — https://api.search.brave.com (needs a key)
#   tavily  — https://api.tavily.com       (needs a key)
#   searxng — your own instance            (needs base-url, no key)
# [web]
# provider = "brave"
# api-key-env = "BRAVE_API_KEY"
# base-url = "https://searx.example.com"   # searxng only
